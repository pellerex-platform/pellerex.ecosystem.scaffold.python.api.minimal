name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]

# The build only reads the repository, so its token may do nothing else.
permissions:
  contents: read

jobs:
  # The shared build, the same for every template: on the main branch it builds the image
  # once and pushes it tagged with its commit (and latest and v1.0.0); on any other branch it
  # only builds. CD deploys that commit's image to every environment.
  build:
    uses: pellerex-platform/workflows/.github/workflows/ci.yaml@v2
    with:
      project_name: Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier
      docker_repository: pellerex/RepoUniqueNormalisedIdentifier
    secrets: inherit
