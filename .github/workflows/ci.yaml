name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]

# The build only reads the repository, so its token may do nothing else.
permissions:
  contents: read

env:
  PROJECT_NAME: Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier
  DOCKER_REPOSITORY: pellerex/RepoUniqueNormalisedIdentifier

# Both jobs name ubuntu-24.04 rather than ubuntu-latest, which GitHub moves to Ubuntu 26
# from 19 Oct 2026. They stay on 24.04 until this build has been proven on Ubuntu 26.
jobs:
  # The main branch builds the image and pushes it. The registry login is kept on the
  # ContainerRegistry environment, which GitHub hands to the main branch only, so a run on
  # any other branch cannot read it.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: ContainerRegistry
      deployment: false
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The unit tests run in the Dockerfile's unit-tests stage, so this file stays the same in
      # every language. Their results and coverage are kept as the test-coverage artifact,
      # which Pellerex reads after the build for the app's Test Coverage tab. The job stops
      # after the upload when a test failed, so a build with a failing test publishes nothing.
      # The results are written outside the checkout, so the image build's context stays as
      # it was. The new steps name each action by its full commit (the version beside it).
      - name: Run unit tests
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          target: unit-test-results
          outputs: type=local,dest=${{ runner.temp }}/unit-test-results

      - name: Upload test coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: ${{ runner.temp }}/unit-test-results/test-coverage/

      - name: Stop when a unit test failed
        run: grep -qx 0 "${{ runner.temp }}/unit-test-results/unit-tests-exit-code"

      - name: Upload infrastructure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}
          path: infrastructure/**

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.PELLEREX_DOCKER_CONTAINERREGISTRY_USERNAME }}
          password: ${{ secrets.PELLEREX_DOCKER_CONTAINERREGISTRY_TOKEN }}

      # The image is also tagged with the full commit it was built from. CD deploys that
      # tag, so each environment runs the image its release named, even after a pod
      # restarts. latest and v1.0.0 are still pushed as before.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}
            ${{ env.DOCKER_REPOSITORY }}:latest
            ${{ env.DOCKER_REPOSITORY }}:v1.0.0

  # Any other branch builds the image to show that it builds. It has no registry login and
  # pushes nothing.
  build-without-publishing:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The same unit tests as in the job above.
      - name: Run unit tests
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          target: unit-test-results
          outputs: type=local,dest=${{ runner.temp }}/unit-test-results

      - name: Upload test coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: ${{ runner.temp }}/unit-test-results/test-coverage/

      - name: Stop when a unit test failed
        run: grep -qx 0 "${{ runner.temp }}/unit-test-results/unit-tests-exit-code"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
