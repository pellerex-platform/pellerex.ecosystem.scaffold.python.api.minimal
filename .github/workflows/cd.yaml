name: CD
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

# Each environment deploys the image CI built from one commit: the shared deploy names that
# commit's tag by default, the commit of the CI run that started this deploy or, for a run
# started by hand, the commit it was started on. CI pushes that tag for main only, so start
# a run by hand on main, once CI has finished for the commit.
jobs:
  qualityassurance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: pellerex-platform/workflows/.github/workflows/cd.yaml@v2
    with:
      project_name: Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier
      helm_release_name: RepoUniqueIdentifier
      docker_repository: pellerex/RepoUniqueNormalisedIdentifier
      kubernetes_namespace: <qualityassurance-namespace>
      target_environment: qualityassurance
    secrets: inherit

  staging:
    needs: qualityassurance
    uses: pellerex-platform/workflows/.github/workflows/cd.yaml@v2
    with:
      project_name: Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier
      helm_release_name: RepoUniqueIdentifier
      docker_repository: pellerex/RepoUniqueNormalisedIdentifier
      kubernetes_namespace: <staging-namespace>
      target_environment: staging
    secrets: inherit

  production:
    needs: staging
    uses: pellerex-platform/workflows/.github/workflows/cd.yaml@v2
    with:
      project_name: Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier
      helm_release_name: RepoUniqueIdentifier
      docker_repository: pellerex/RepoUniqueNormalisedIdentifier
      kubernetes_namespace: <production-namespace>
      target_environment: production
    secrets: inherit
