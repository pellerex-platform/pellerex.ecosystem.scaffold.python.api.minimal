apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: RepoUniqueNormalisedIdentifier-api-vault
  namespace: <staging-namespace>
spec:
  provider: azure
  # No `secretObjects` block (PY-D6): secrets are delivered ONLY as files on the tmpfs mount,
  # never synced to a Kubernetes Secret (which would persist base64 in etcd). The app reads
  # them via pydantic-settings `secrets_dir`; there is no in-app SecretClient/DefaultAzureCredential.
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<identity-id>"
    keyvaultName: "<staging-keyvault-name>"
    cloudName: ""
    cloudEnvFileName: ""
    objects: |
      array:
        - |
          objectName: DbConnectionString
          objectAlias: DbConnectionString
          objectType: secret
          objectVersion: ""

    tenantId: "<tenant-id>"
