replicaCount: 1
deploymentStrategy: RollingUpdate

image:
  repository: pellerex/RepoUniqueNormalisedIdentifier
  pullPolicy: Always
  tag: "v1.0.0"

env:
  - name: "ENVIRONMENT"
    value: "qualityassurance"
  - name: "LOG_LEVEL"
    value: "info"

global:
  envValuesFrom:
    Runtime__IpAddress: status.podIP

secretProviderClass:
  enabled: <secret-provider-class-enabled>

volumes:
  - name: RepoUniqueNormalisedIdentifier-keyvault-volume
    csiSecretProviderClass: RepoUniqueNormalisedIdentifier-api-vault

volumeMounts:
  - name: RepoUniqueNormalisedIdentifier-keyvault-volume
    readOnly: true
    mountPath: /mnt/secrets-store

# Writable emptyDir for the daily-rolling file sinks (must match config.{env}.json
# log_file_directory). emptyDir is ephemeral - files complement stdout/App Insights,
# they are not the durable store.
logging:
  directory: /var/log/app

imagePullSecrets:
  - name: image-pull-secret
nameOverride: ""
fullnameOverride: "<managed-service-name>"

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: <port-number>

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
